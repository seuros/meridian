  <g fill="#D7262F">
    <!-- horns -->
    <path d="M92 64 C70 44 66 24 70 18 C84 28 96 44 100 64 Z"/>
    <path d="M164 64 C186 44 190 24 186 18 C172 28 160 44 156 64 Z"/>
