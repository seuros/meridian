    <ellipse cx="104" cy="124" rx="15" ry="17"/>
    <ellipse cx="152" cy="124" rx="15" ry="17"/>
  </g>
  <g fill="#000">
    <circle cx="108" cy="128" r="7"/>
    <circle cx="148" cy="128" r="7"/>
  </g>
  <!-- grin (hole) -->
  <path d="M92 158 q36 40 72 0 q-36 18 -72 0z" fill="#000"/>
</svg>
